site_name: LAMULA Jobs
site_description: Demo bajo demanda — Level II del cliente → ORPG real → productos Level III en el WebViewer
docs_dir: docs

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list

nav:
  - Inicio: index.md
  - Alcance:
      - Contexto: alcance/contexto.md
      - Decisiones de diseño: alcance/decisiones.md
      - Pendientes: alcance/pendientes.md
  - Arquitectura:
      - Componentes: arquitectura/componentes.md
      - Ciclo del runner: arquitectura/ciclo-runner.md
      - Aislamiento de datos: arquitectura/aislamiento-datos.md
      - Fuentes de entrada: arquitectura/fuentes-entrada.md
  - Operación:
      - Acceso y cuotas: operacion/acceso-y-cuotas.md
      - Límites y recursos: operacion/limites-recursos.md
  - Implementación:
      - Fases: implementacion/fases.md
      - F0 en una máquina con Docker: implementacion/f0-ejecucion.md
      - Plan de trabajo autónomo: implementacion/plan-autonomo.md
  - Referencia:
      - Hechos verificados del ORPG: referencia/orpg-hechos.md
      - Velocidad de reproducción: referencia/velocidad-reproduccion.md
      - Perfil del ORPG: referencia/perfil-orpg.md
      - Equivalencia y recursos: referencia/equivalencia-y-recursos.md
      - Catálogo verificado: referencia/catalogo-verificado.md
      - Contrato con el pipeline: referencia/contrato-pipeline.md
      - Licencia del CODE: referencia/licencia.md
